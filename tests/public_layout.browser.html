<!doctype html><html><head><meta charset="utf-8"><title>DrillOps layout review</title><base href="../docs/"><style>body{font:14px system-ui;margin:20px;background:#e8ece8}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{padding:8px}iframe{border:1px solid #acb7ac;background:white;height:760px;display:block;transform-origin:top left}pre{white-space:pre-wrap}#test{position:absolute;left:-10000px;top:0}</style></head><body><header><strong>DrillOps public layout review</strong><select id="page"></select><select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select><button id="run">Run all 50 layout checks</button><span id="status">Ready</span></header><iframe id="preview" title="Public page preview"></iframe><pre id="results"></pre><iframe id="test" title="Layout test"></iframe><script>
const pages=['index.html','drillops.html','accounting.html','project-management.html','fieldops.html','fieldmaps.html','support.html','privacy.html','fieldops-support.html','fieldops-privacy.html'];
const page=document.querySelector('#page'),width=document.querySelector('#width'),preview=document.querySelector('#preview');
pages.forEach(p=>page.add(new Option(p,p)));function show(){preview.style.width=width.value+'px';preview.src=page.value;preview.style.transform=+width.value>innerWidth-50?'scale('+((innerWidth-50)/width.value)+')':''}page.onchange=width.onchange=show;const params=new URLSearchParams(location.search);if(pages.includes(params.get('page')))page.value=params.get('page');if(['360','390','768','1024','1440'].includes(params.get('width')))width.value=params.get('width');show();
document.querySelector('#run').onclick=async()=>{const frame=document.querySelector('#test'),rows=[];let failures=0;for(const p of pages)for(const w of [360,390,768,1024,1440]){document.querySelector('#status').textContent=p+' at '+w;frame.style.width=w+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src=p});const d=frame.contentDocument;await Promise.all([...d.images].map(img=>{img.loading='eager';return img.decode().catch(()=>{})}));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const errors=[];if(d.documentElement.scrollWidth>w)errors.push('page overflow '+d.documentElement.scrollWidth);for(const el of d.querySelectorAll('main *, .site-nav *, .site-footer *')){const r=el.getBoundingClientRect();if(r.width&& (r.right>w+1||r.left< -1))errors.push('overflow '+el.tagName+'.'+el.className)}for(const img of d.images)if(!img.naturalWidth)errors.push('broken '+img.getAttribute('src'));const menu=d.querySelector('.mobile-menu');if(w<960){menu.querySelector('summary').click();if(!menu.open)errors.push('menu did not open');d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));if(menu.open)errors.push('Escape did not close menu');}const nav=d.querySelector('.site-nav').getBoundingClientRect();if(nav.height!==(w<800?68:80))errors.push('nav height '+nav.height);failures+=errors.length;rows.push(p+' '+w+': '+(errors.length?errors.join(', '):'PASS'));}document.querySelector('#results').textContent=rows.join('\n');document.querySelector('#status').textContent='Complete: 50 checks, '+failures+' failures';};
</script></body></html>
