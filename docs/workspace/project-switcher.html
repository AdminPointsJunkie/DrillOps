<div class="project-switcher" id="project-switcher">
  <div id="project-switcher-panel" class="project-switcher-panel" hidden>
    <div class="project-switcher-title">Your projects</div>
    <label class="sr-only" for="project-switcher-search">Find a project</label>
    <input id="project-switcher-search" type="search" placeholder="Find a project…" autocomplete="off">
    <div id="project-switcher-options" role="group" aria-label="Projects"></div>
  </div>
  <button id="project-switcher-button" type="button" aria-expanded="false" aria-controls="project-switcher-panel"><span class="project-switcher-symbol" aria-hidden="true">▦</span><span><small>PROJECT</small><strong id="project-switcher-name">Choose a project</strong><span id="project-switcher-meta"></span></span><span aria-hidden="true">⌃</span></button>
</div>
