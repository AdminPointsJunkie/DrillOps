<section class="page" id="page-drilling-schedule">
 <div class="rs-heading"><div><div class="rs-eyebrow">PROJECT / PLANNING</div><h1>Rig scheduler</h1><p id="rs-context"></p></div><div class="rs-heading-actions"><button class="btn-secondary" onclick="loadDrillingSchedule()">Refresh</button><button class="btn-primary" onclick="newRigBooking()">Add booking</button></div></div>
 <p id="rs-message" role="status"></p>
 <div id="rs-content" hidden>
 <div class="rs-toolbar"><label>Project / site<select id="rs-project" onchange="filterRigSchedule()"><option value="">All projects / sites</option></select></label><label>Rig<select id="rs-rig" onchange="renderDrillingSchedule()"><option value="">All rigs</option></select></label><label>Status<select id="rs-status" onchange="renderDrillingSchedule()"><option value="">All statuses</option><option>Planned</option><option>In Progress</option><option>Complete</option><option>Reported</option></select></label><label>From<input id="rs-from" type="date" onchange="renderDrillingSchedule()"></label><label>To<input id="rs-to" type="date" onchange="renderDrillingSchedule()"></label><label>Zoom<select id="rs-zoom" onchange="renderDrillingSchedule()"><option value="36">Day</option><option value="20" selected>Week</option><option value="8">Month</option></select></label><div class="rs-range-buttons"><button class="btn-ghost" onclick="shiftRigSchedule(-1)" aria-label="Previous period">←</button><button class="btn-ghost" onclick="rigScheduleToday()">Today</button><button class="btn-ghost" onclick="shiftRigSchedule(1)" aria-label="Next period">→</button><button class="btn-ghost" onclick="fitRigSchedule()">Fit schedule</button></div></div>
 <div id="rs-stats" class="rs-stats"></div>
 <div class="rs-legend"><span><i class="planned"></i>Planned</span><span><i class="reported"></i>EOS reported</span><span><i class="progress"></i>In progress</span><span><i class="complete"></i>Complete</span><span><i class="conflict"></i>Rig clash</span><span><i class="break"></i>Roster break</span><label><input type="checkbox" id="rs-show-backlog" onchange="renderDrillingSchedule()"> Unscheduled holes</label></div>
 <div class="rs-board"><aside class="rs-backlog"><h2>Unscheduled <span id="rs-backlog-count"></span></h2><div id="rs-backlog"></div></aside><div class="rs-timeline-scroll" id="rs-timeline-scroll"><div id="rs-timeline"></div></div></div>

 </div>
 <aside id="rs-editor" class="rs-editor" hidden aria-label="Schedule details"><div class="rs-editor-heading"><div><h2 id="rs-editor-title"></h2><p id="rs-editor-sub"></p></div><button class="btn-ghost" onclick="closeRigScheduleEditor()" aria-label="Close schedule details">×</button></div><form id="rs-form"><label>Project / site<input id="rs-edit-project" list="rs-projects" required><datalist id="rs-projects"></datalist></label><label>Hole<input id="rs-edit-hole"></label><label>Site ID<input id="rs-edit-site"></label><label>Booking type<select id="rs-edit-kind"><option>Drilling</option><option>Break</option><option>Other</option></select></label><label>Rig<input id="rs-edit-rig" list="rs-rigs" placeholder="Assign rig"><datalist id="rs-rigs"></datalist></label><div class="rs-editor-dates"><label>Start<input id="rs-edit-start" type="date"></label><label>End<input id="rs-edit-end" type="date"></label></div><label>Status<select id="rs-edit-status"><option>Planned</option><option>In Progress</option><option>Complete</option><option disabled>Reported</option><option>Cancelled</option></select></label><label>Notes<textarea id="rs-edit-notes" rows="4"></textarea></label><p id="rs-edit-info"></p><details><summary>Source</summary><p id="rs-edit-source"></p></details><p id="rs-edit-warning" role="status"></p><div class="rs-editor-actions"><button class="btn-primary" id="rs-save" type="submit">Save schedule</button><button class="btn-secondary" type="button" id="rs-clear" onclick="clearRigScheduleDates()">Unassign dates</button></div></form></aside>
</section>
