<section class="page management-page" id="page-project-budgets">
      <div class="management-head">
        <div>
          <div class="management-title">Campaign register</div>
          <div class="management-subtitle">Review campaigns in the selected company workspace. Manage projects and sharing in Workspace settings.</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" type="button" onclick="showNewClientDialog()">Workspace people</button>
          <button class="btn-primary" type="button" onclick="showNewProjectDialog()">Add project or campaign</button>
        </div>
      </div>
      <div class="management-toolbar">
        <input class="management-search" id="project-register-search" placeholder="Search by company or campaign" oninput="renderClientProjectHierarchy()"/>
        <select id="project-register-status" class="range-date" onchange="renderClientProjectHierarchy()">
          <option value="">All status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
      <div class="management-table">
        <div class="tbl-scroll" style="max-height:360px;">
          <table id="client-project-table">
            <thead><tr><th>Company</th><th>Campaign</th><th>Status</th><th>Project</th><th>Rate source</th><th>Year</th><th></th></tr></thead>
            <tbody id="client-project-body"></tbody>
          </table>
        </div>
      </div>
    </section>
