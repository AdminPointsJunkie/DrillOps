<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#19201d">
  <title>DrillOps Field Portal</title>
  <style>
    :root{--navy:#19201d;--orange:#315d49;--ink:#162534;--muted:#687786;--line:#dce3e8;--bg:#f4f6f8;--card:#fff;--green:#148153;--amber:#bc7412;--red:#b8323d;--shadow:0 12px 34px rgba(16,42,67,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 16px #19201d30}.topbar{max-width:1320px;margin:auto;min-height:68px;padding:12px 24px;display:flex;align-items:center;gap:18px}.brand{font-size:23px;font-weight:850;letter-spacing:-.6px}.brand span{color:var(--orange)}.workspace{display:flex;gap:10px;flex:1;justify-content:center}.workspace select{max-width:260px;width:42%;background:#fff;border:0;border-radius:8px;padding:9px 32px 9px 11px;color:var(--ink)}.identity{text-align:right;font-size:12px;color:#c8d5df}.identity strong{display:block;color:#fff;font-size:13px}.icon-btn{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 11px}
    main{max-width:1320px;margin:0 auto;padding:26px 24px 60px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.hero h1{margin:0;font-size:30px;letter-spacing:-.8px}.hero p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:700}.btn:hover{border-color:#aebbc4}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}
    .tabs{display:flex;gap:4px;background:#e7ebee;padding:4px;border-radius:10px;width:max-content;margin-bottom:18px}.tab{border:0;background:transparent;border-radius:7px;padding:8px 14px;font-weight:700;color:var(--muted)}.tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 5px #19201d20}.badge{display:inline-grid;place-items:center;background:var(--orange);color:#fff;border-radius:20px;min-width:19px;height:19px;padding:0 5px;font-size:11px;margin-left:5px}
    .toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.toolbar input{min-width:280px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.45px;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table td{padding:15px 16px;border-bottom:1px solid #edf0f2;vertical-align:middle}.data-table tr:last-child td{border:0}.data-table tbody tr:hover{background:#fafbfc}.strong{font-weight:760}.secondary{font-size:13px;color:var(--muted)}.status{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:750;text-transform:capitalize;background:#e8edf1}.status.approved{color:var(--green);background:#e4f4ec}.status.submitted{color:#315d49;background:#e4f2fa}.status.query{color:var(--amber);background:#fff1d9}.status.rejected{color:var(--red);background:#fbe7e9}.status.draft{color:#5e6b76}.empty{padding:60px 22px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}.notice{padding:12px 15px;border:1px solid #f0d19a;background:#fff7e6;color:#795119;border-radius:10px;margin-bottom:14px}
    .notification{display:grid;grid-template-columns:13px 1fr auto;gap:12px;padding:16px;border-bottom:1px solid #edf0f2;align-items:start}.notification:last-child{border:0}.dot{width:9px;height:9px;margin-top:6px;border-radius:50%;background:transparent}.notification.unread .dot{background:var(--orange)}.notification h3{font-size:15px;margin:0 0 3px}.notification p{margin:0;color:var(--muted)}.notification time{font-size:12px;color:var(--muted);white-space:nowrap}
    dialog{border:0;border-radius:16px;padding:0;width:min(920px,calc(100% - 28px));max-height:92vh;box-shadow:0 28px 80px #19201d50}dialog::backdrop{background:#19201d7d;backdrop-filter:blur(2px)}.dialog-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:17px 22px;display:flex;align-items:center;justify-content:space-between}.dialog-head h2{font-size:20px;margin:0}.close{border:0;background:#eef1f3;border-radius:50%;width:34px;height:34px}.dialog-body{padding:21px 22px;overflow:auto}.dialog-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:9px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field.span-2{grid-column:span 2}.field.span-3{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#52616e}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd8df;border-radius:8px;padding:9px 10px;background:#fff}.field textarea{min-height:74px;resize:vertical}.field.checkbox{flex-direction:row;align-items:center;margin-top:24px}.field.checkbox input{width:auto}.subsection{margin-top:23px}.subsection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.subsection-head h3{font-size:15px;margin:0}.line-row{display:grid;grid-template-columns:90px 90px 100px 80px 80px 1fr 35px;gap:7px;margin-bottom:7px}.crew-row{display:grid;grid-template-columns:2fr 1.4fr 1fr 35px;gap:7px;margin-bottom:7px}.item-row{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr 35px;gap:7px;margin-bottom:7px}.line-row input,.crew-row input,.item-row input{min-width:0;border:1px solid #d5dde3;border-radius:7px;padding:8px}.remove{border:0;background:#fbe7e9;color:var(--red);border-radius:7px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{padding:14px;background:#f4f7f9;border-radius:10px}.metric strong{display:block;font-size:21px}.metric span{font-size:12px;color:var(--muted)}.detail-section{padding:14px 0;border-top:1px solid var(--line)}.detail-section h3{margin:0 0 8px}.timeline-item{border-left:2px solid #d9e1e6;padding:2px 0 12px 13px}.error{color:var(--red);font-size:13px}.toast{position:fixed;z-index:99;right:20px;bottom:20px;background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;box-shadow:var(--shadow)}
    @media(max-width:760px){.topbar{padding:10px 14px;flex-wrap:wrap}.workspace{order:3;width:100%}.workspace select{max-width:none;width:50%}.identity{display:none}main{padding:20px 14px 50px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:25px}.toolbar{flex-wrap:wrap}.toolbar input{min-width:0;flex:1}.form-grid{grid-template-columns:1fr 1fr}.field.span-3{grid-column:1/-1}.line-row{grid-template-columns:1fr 1fr 1fr}.line-row input:nth-child(n+4){grid-column:span 1}.line-row input:nth-child(6){grid-column:span 2}.crew-row,.item-row{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.data-table th:nth-child(3),.data-table td:nth-child(3),.data-table th:nth-child(5),.data-table td:nth-child(5){display:none}}
  </style>
  <link rel="stylesheet" href="./drillops-theme.css">
</head>
<body>
  <header><div class="topbar">
    <div class="brand">Drill<span>Ops</span></div>
    <div class="workspace"><select id="client-select" aria-label="Client"><option value="">Select client</option></select><select id="project-select" aria-label="Project" disabled><option value="">Select project</option></select></div>
    <div class="identity"><strong id="user-name">Loading…</strong><span id="user-role"></span></div>
    <button class="icon-btn hidden" id="management-portal" title="Open the management portal">Management portal</button>
    <button class="icon-btn" id="logout" title="Sign out">Sign out</button>
  </div></header>
  <main>
    <div class="hero"><div><h1 id="page-title">Daily activity reports</h1><p id="workspace-label">Select a client and project to begin.</p></div><div class="actions"><button class="btn" id="refresh">Refresh</button><button class="btn primary hidden" id="new-dar">+ New DAR</button></div></div>
    <div class="tabs"><button class="tab active" data-tab="dars">DARs</button><button class="tab" data-tab="notifications">Notifications <span class="badge hidden" id="unread-badge">0</span></button></div>
    <section id="dars-panel">
      <div class="toolbar"><input id="search" type="search" placeholder="Search hole, contractor, rig or date"><select id="status-filter"><option>All</option><option>Draft</option><option>Submitted</option><option>Approved</option><option>Query</option><option>Rejected</option></select></div>
      <div class="card table-wrap" id="dar-list"><div class="empty"><strong>Choose a project</strong>DAR submissions will appear here.</div></div>
    </section>
    <section id="notifications-panel" class="hidden"><div id="email-notice" class="notice hidden"></div><div class="actions" style="justify-content:flex-end;margin-bottom:10px"><button class="btn hidden" id="mark-all">Mark all read</button></div><div class="card" id="notification-list"><div class="empty"><strong>No notifications</strong>Submission and review alerts will appear here.</div></div></section>
  </main>

  <dialog id="dar-dialog"><form id="dar-form">
    <div class="dialog-head"><h2 id="form-title">New daily activity report</h2><button type="button" class="close" data-close="dar-dialog">×</button></div>
    <div class="dialog-body"><div id="form-error" class="error"></div><div class="form-grid">
      <div class="field"><label>Contractor *</label><select name="contractor" required></select></div><div class="field"><label>Date *</label><input name="report_date" type="date" required></div><div class="field"><label>Shift *</label><select name="shift"><option>Day</option><option>Night</option></select></div>
      <div class="field"><label>Hole *</label><select name="hole_id" required></select></div><div class="field"><label>Site</label><input name="site_name"></div><div class="field"><label>Rig ID *</label><input name="rig_id" required></div>
      <div class="field"><label>Supervisor *</label><input name="supervisor_name" required></div><div class="field"><label>Driller *</label><input name="driller_name" required></div><div class="field"><label>Weather</label><input name="weather"></div>
      <div class="field"><label>Start depth (m)</label><input name="metres_start" type="number" step="0.1" value="0"></div><div class="field"><label>End depth (m)</label><input name="metres_end" type="number" step="0.1" value="0"></div><div class="field"><label>Operating hours</label><input name="operating_hours" type="number" step="0.1" value="0"></div>
      <div class="field"><label>Downtime hours</label><input name="downtime_hours" type="number" step="0.1" value="0"></div><div class="field checkbox span-2"><input name="has_safety_incident" type="checkbox"><label>Safety incident occurred</label></div>
      <div class="field span-3"><label>Safety summary / incident details</label><textarea name="safety_summary"></textarea></div>
    </div>
    <div class="subsection"><div class="subsection-head"><h3>Activity timeline</h3><button class="btn" type="button" id="add-activity">Add activity</button></div><div id="activity-lines"></div></div>
    <div class="subsection"><div class="subsection-head"><h3>Crew</h3><button class="btn" type="button" id="add-crew">Add crew</button></div><div id="crew-lines"></div></div>
    <div class="subsection"><div class="subsection-head"><h3>Consumables</h3><button class="btn" type="button" id="add-item">Add item</button></div><div id="item-lines"></div></div>
    <div class="form-grid" style="margin-top:22px"><div class="field span-3"><label>Delays and downtime</label><textarea name="delay_summary"></textarea></div><div class="field span-3"><label>Geology observations</label><textarea name="geology_summary"></textarea></div><div class="field span-3"><label>Other notes</label><textarea name="notes"></textarea></div></div>
    </div><div class="dialog-foot"><button class="btn" type="button" data-close="dar-dialog">Cancel</button><button class="btn" type="button" id="save-draft">Save draft</button><button class="btn primary" type="submit">Submit for approval</button></div>
  </form></dialog>

  <dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title">DAR</h2><button class="close" data-close="detail-dialog">×</button></div><div class="dialog-body" id="detail-body"></div><div class="dialog-foot" id="detail-actions"><button class="btn" data-close="detail-dialog">Close</button></div></dialog>
  <dialog id="review-dialog"><form id="review-form"><div class="dialog-head"><h2>Review DAR</h2><button type="button" class="close" data-close="review-dialog">×</button></div><div class="dialog-body"><div class="form-grid"><div class="field span-3"><label>Decision</label><select name="status"><option value="approved">Approve</option><option value="query">Raise query</option><option value="rejected">Reject</option></select></div><div class="field span-3"><label>Review note</label><textarea name="reason" placeholder="Required for a query or rejection"></textarea></div></div><div id="review-error" class="error"></div></div><div class="dialog-foot"><button type="button" class="btn" data-close="review-dialog">Cancel</button><button class="btn primary" type="submit">Save decision</button></div></form></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="config.js"></script><script src="auth-guard.js"></script>
  <script>
  const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:8000':'https://api.drillops.com.au';
  const state={user:null,clients:[],projects:[],project:null,permissions:new Set(),contractors:[],boreholes:[],dars:[],notifications:[],events:{},editing:null,reviewing:null};
  const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  async function api(path,options={}){const response=await fetch(API+path,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'Request failed');return data}
  function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
  function fail(error,target=''){if(target)$(target).textContent=error.message;else toast(error.message)}
  const today=()=>new Date().toLocaleDateString('en-CA');const number=value=>Number(value||0);const displayDate=value=>value?new Date(value+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'—';

  async function initialize(){
    try{[state.user,state.clients,state.projects]=await Promise.all([api('/mobile/me'),api('/mobile/clients'),api('/mobile/projects')]);$('user-name').textContent=state.user.name;$('user-role').textContent=state.user.role;$('management-portal').classList.toggle('hidden',state.user.management_portal_access!==true&&state.user.role!=='System Administrator');renderClients();const requested=Number(new URLSearchParams(location.search).get('project'));if(requested){const project=state.projects.find(item=>item.id===requested);if(project){$('client-select').value=project.client_id||'';renderProjects();$('project-select').value=project.id;await selectProject(project.id)}}}catch(error){fail(error)}
  }
  function renderClients(){$('client-select').innerHTML='<option value="">Select client</option>'+state.clients.map(item=>`<option value="${item.id}">${esc(item.name)}</option>`).join('')}
  function renderProjects(){const client=Number($('client-select').value);const projects=state.projects.filter(item=>item.client_id===client);$('project-select').disabled=!client;$('project-select').innerHTML='<option value="">Select project</option>'+projects.map(item=>`<option value="${item.id}">${esc(item.name)}</option>`).join('')}
  async function selectProject(projectID){
    state.project=state.projects.find(item=>item.id===Number(projectID))||null;if(!state.project)return;const requestedDAR=new URLSearchParams(location.search).get('dar');
    $('workspace-label').textContent=`${state.project.client_name||''} · ${state.project.name}`;history.replaceState(null,'',`field.html?project=${state.project.id}${requestedDAR?'&dar='+encodeURIComponent(requestedDAR):''}`);
    try{const [permissionData,contractors,boreholes,dars,feed]=await Promise.all([api(`/mobile/projects/${state.project.id}/permissions`),api(`/mobile/projects/${state.project.id}/contractors`),api(`/mobile/projects/${state.project.id}/boreholes`),api(`/mobile/projects/${state.project.id}/dars`),api(`/mobile/notifications?project_id=${state.project.id}`)]);state.permissions=new Set(permissionData.permissions);state.contractors=contractors;state.boreholes=boreholes;state.dars=dars;state.notifications=feed.items;$('new-dar').classList.toggle('hidden',!state.permissions.has('reports.create'));$('email-notice').classList.toggle('hidden',feed.email_delivery!=='unconfigured');$('email-notice').textContent='In-app notifications are active. Email messages are queued until the mail provider is configured.';renderDARs();renderNotifications();if(requestedDAR&&state.dars.some(item=>item.id===requestedDAR))openDetail(requestedDAR)}catch(error){fail(error)}
  }
  function renderDARs(){
    if(!state.project){$('dar-list').innerHTML='<div class="empty"><strong>Choose a project</strong>DAR submissions will appear here.</div>';return}
    const needle=$('search').value.trim().toLowerCase(),status=$('status-filter').value.toLowerCase();const rows=state.dars.filter(item=>(status==='all'||item.status===status)&&(!needle||[item.report_date,item.hole_id,item.contractor,item.rig_id].join(' ').toLowerCase().includes(needle)));
    if(!rows.length){$('dar-list').innerHTML='<div class="empty"><strong>No matching DARs</strong>Create a report or change the filters.</div>';return}
    $('dar-list').innerHTML=`<table class="data-table"><thead><tr><th>Date / hole</th><th>Contractor</th><th>Shift</th><th>Metres</th><th>Rig</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(item=>`<tr><td><div class="strong">${esc(item.hole_id||'Daily activity report')}</div><div class="secondary">${displayDate(item.report_date)}</div></td><td>${esc(item.contractor)}</td><td>${esc(item.shift)}</td><td>${number(item.total_metres).toFixed(1)} m</td><td>${esc(item.rig_id||'—')}</td><td><span class="status ${esc(item.status)}">${esc(item.status)}</span></td><td><button class="btn" onclick="openDetail('${item.id}')">Open</button></td></tr>`).join('')}</tbody></table>`;
  }
  function renderNotifications(){
    const unread=state.notifications.filter(item=>!item.read_at).length;$('unread-badge').textContent=unread;$('unread-badge').classList.toggle('hidden',!unread);$('mark-all').classList.toggle('hidden',!unread);
    if(!state.notifications.length){$('notification-list').innerHTML='<div class="empty"><strong>No notifications</strong>Submission and review alerts will appear here.</div>';return}
    $('notification-list').innerHTML=state.notifications.map(item=>`<div class="notification ${item.read_at?'':'unread'}" onclick="openNotification('${item.id}','${item.dar_id||''}')"><span class="dot"></span><div><h3>${esc(item.title)}</h3><p>${esc(item.body)}</p></div><time>${new Date(item.created_at).toLocaleDateString('en-AU')}</time></div>`).join('')
  }
  async function refresh(){if(state.project)await selectProject(state.project.id)}

  function openForm(report=null){
    state.editing=report;$('form-title').textContent=report?'Edit daily activity report':'New daily activity report';$('form-error').textContent='';const form=$('dar-form');form.reset();form.elements.contractor.innerHTML='<option value="">Select contractor</option>'+state.contractors.map(item=>`<option>${esc(item.contractor)}</option>`).join('');form.elements.hole_id.innerHTML='<option value="">Select hole</option>'+state.boreholes.map(item=>`<option>${esc(item.hole_id)}</option>`).join('');
    const values=report||{report_date:today(),shift:'Day',site_name:state.project?.name||'',activities:[],crew:[],consumables:[]};['contractor','report_date','shift','hole_id','site_name','rig_id','supervisor_name','driller_name','weather','metres_start','metres_end','operating_hours','downtime_hours','safety_summary','delay_summary','geology_summary','notes'].forEach(name=>{form.elements[name].value=values[name]??(name.includes('metres')||name.includes('hours')?0:'')});form.elements.has_safety_incident.checked=!!values.has_safety_incident;$('activity-lines').innerHTML='';$('crew-lines').innerHTML='';$('item-lines').innerHTML='';(values.activities||[]).forEach(addActivity);(values.crew||[]).forEach(addCrew);(values.consumables||[]).forEach(addItem);$('dar-dialog').showModal();
  }
  function rowInput(name,placeholder,value='',type='text'){return `<input name="${name}" type="${type}" ${type==='number'?'step="0.1"':''} placeholder="${placeholder}" value="${esc(value)}">`}
  function addActivity(value={}){const row=document.createElement('div');row.className='line-row';row.innerHTML=rowInput('time_from','From',value.time_from)+rowInput('time_to','To',value.time_to)+rowInput('code','Code',value.code)+rowInput('hours','Hours',value.hours,'number')+rowInput('metres','Metres',value.metres,'number')+rowInput('notes','Activity notes',value.notes)+'<button type="button" class="remove">×</button>';row.querySelector('button').onclick=()=>row.remove();$('activity-lines').append(row)}
  function addCrew(value={}){const row=document.createElement('div');row.className='crew-row';row.innerHTML=rowInput('name','Name',value.name)+rowInput('role','Role',value.role)+rowInput('hours','Hours',value.hours)+'<button type="button" class="remove">×</button>';row.querySelector('button').onclick=()=>row.remove();$('crew-lines').append(row)}
  function addItem(value={}){const row=document.createElement('div');row.className='item-row';row.innerHTML=rowInput('name','Item',value.name)+rowInput('type','Type',value.type)+rowInput('quantity','Quantity',value.quantity)+rowInput('unit','Unit',value.unit)+'<button type="button" class="remove">×</button>';row.querySelector('button').onclick=()=>row.remove();$('item-lines').append(row)}
  function collectRows(container,names){return [...$(container).children].map(row=>Object.fromEntries(names.map(name=>[name,row.querySelector(`[name="${name}"]`).value]))).filter(item=>Object.values(item).some(Boolean))}
  function formPayload(){const form=$('dar-form'),raw=Object.fromEntries(new FormData(form));const start=number(raw.metres_start),end=number(raw.metres_end);return {...raw,metres_start:start,metres_end:end,total_metres:Math.max(0,end-start),operating_hours:number(raw.operating_hours),downtime_hours:number(raw.downtime_hours),has_safety_incident:form.elements.has_safety_incident.checked,activities:collectRows('activity-lines',['time_from','time_to','code','hours','metres','notes']).map(item=>({...item,hours:number(item.hours),metres:number(item.metres)})),crew:collectRows('crew-lines',['name','role','hours']),consumables:collectRows('item-lines',['name','type','quantity','unit'])}}
  async function saveDAR(submit){
    $('form-error').textContent='';try{const payload=formPayload();if(!payload.contractor)throw new Error('Select a contractor.');if(submit&&(!payload.hole_id||!payload.rig_id||!payload.supervisor_name||!payload.driller_name))throw new Error('Hole, rig, supervisor and driller are required before submission.');if(submit&&(!payload.activities.length||payload.activities.some(item=>!item.code.trim())))throw new Error('Add at least one activity and give every activity a code.');if(submit&&payload.has_safety_incident&&!payload.safety_summary.trim())throw new Error('Add the safety incident details before submission.');const path=state.editing?`/mobile/projects/${state.project.id}/dars/${state.editing.id}`:`/mobile/projects/${state.project.id}/dars`;const saved=await api(path,{method:state.editing?'PATCH':'POST',body:JSON.stringify(payload)});if(submit)await api(`/mobile/projects/${state.project.id}/dars/${saved.id}/submit`,{method:'POST',body:'{}'});$('dar-dialog').close();toast(submit?'DAR submitted for approval.':'Draft saved.');await refresh()}catch(error){fail(error,'form-error')}
  }

  async function openDetail(id){
    try{const result=await api(`/mobile/projects/${state.project.id}/dars/${id}`),item=result.dar;state.events[id]=result.events;$('detail-title').textContent=item.hole_id||'Daily activity report';$('detail-body').innerHTML=`<div><span class="status ${esc(item.status)}">${esc(item.status)}</span><h2 style="margin:8px 0 2px">${displayDate(item.report_date)}</h2><div class="secondary">${esc([item.contractor,item.shift,item.rig_id].filter(Boolean).join(' · '))}</div></div><div class="detail-grid"><div class="metric"><strong>${number(item.total_metres).toFixed(1)}</strong><span>metres drilled</span></div><div class="metric"><strong>${number(item.operating_hours).toFixed(1)}</strong><span>operating hours</span></div><div class="metric"><strong>${number(item.downtime_hours).toFixed(1)}</strong><span>downtime hours</span></div></div><div class="detail-section"><h3>Shift details</h3><p>${esc(item.site_name||'')} · Supervisor: ${esc(item.supervisor_name||'—')} · Driller: ${esc(item.driller_name||'—')}</p><p>${item.has_safety_incident?'<strong style="color:var(--red)">Safety incident reported</strong>':'No safety incident reported'}${item.safety_summary?' · '+esc(item.safety_summary):''}</p>${item.delay_summary?`<p><strong>Delays:</strong> ${esc(item.delay_summary)}</p>`:''}${item.geology_summary?`<p><strong>Geology:</strong> ${esc(item.geology_summary)}</p>`:''}${item.notes?`<p><strong>Notes:</strong> ${esc(item.notes)}</p>`:''}</div>${renderDetailLines('Activity timeline',item.activities,['time_from','time_to','code','metres','notes'])}${renderDetailLines('Crew',item.crew,['name','role','hours'])}${renderDetailLines('Consumables',item.consumables,['name','type','quantity','unit'])}${item.review_reason?`<div class="detail-section"><h3>Review note</h3><p>${esc(item.review_reason)}</p></div>`:''}<div class="detail-section"><h3>Audit trail</h3>${result.events.map(event=>`<div class="timeline-item"><strong>${esc(event.event_type.replace('dar.','').replaceAll('_',' '))}</strong><div class="secondary">${esc(event.actor_name||'System')}${event.note?' · '+esc(event.note):''}</div></div>`).join('')}</div>`;
    const actions=$('detail-actions');actions.innerHTML='<button class="btn" data-close="detail-dialog">Close</button>';actions.querySelector('[data-close]').onclick=()=>$('detail-dialog').close();if(['draft','query','rejected'].includes(item.status)&&state.permissions.has('reports.create')){const button=document.createElement('button');button.className='btn';button.textContent='Edit';button.onclick=()=>{$('detail-dialog').close();openForm(item)};actions.append(button)}if(item.status==='submitted'&&state.permissions.has('reports.review')){const button=document.createElement('button');button.className='btn primary';button.textContent='Review';button.onclick=()=>openReview(item);actions.append(button)}$('detail-dialog').showModal()}catch(error){fail(error)}
  }
  function renderDetailLines(title,items,fields){if(!items?.length)return'';return `<div class="detail-section"><h3>${title}</h3>${items.map(item=>`<p>${fields.map(field=>item[field]).filter(value=>value!==undefined&&value!=='').map(esc).join(' · ')}</p>`).join('')}</div>`}
  function openReview(item){state.reviewing=item;$('review-error').textContent='';$('review-form').reset();$('review-dialog').showModal()}
  async function saveReview(event){event.preventDefault();const form=event.currentTarget,status=form.elements.status.value,reason=form.elements.reason.value.trim();if(status!=='approved'&&!reason){$('review-error').textContent='A reason is required for a query or rejection.';return}try{await api(`/mobile/projects/${state.project.id}/dars/${state.reviewing.id}/review`,{method:'POST',body:JSON.stringify({status,reason})});$('review-dialog').close();$('detail-dialog').close();toast(`DAR ${status}.`);await refresh()}catch(error){fail(error,'review-error')}}
  async function openNotification(notificationID,darID){const item=state.notifications.find(value=>value.id===notificationID);if(item&&!item.read_at){await api(`/mobile/notifications/${notificationID}`,{method:'PATCH',body:JSON.stringify({read:true})});item.read_at=new Date().toISOString();renderNotifications()}if(darID)openDetail(darID)}

  $('client-select').onchange=()=>{renderProjects();state.project=null;$('workspace-label').textContent='Select a project to continue.';renderDARs()};$('project-select').onchange=()=>selectProject($('project-select').value);$('search').oninput=renderDARs;$('status-filter').onchange=renderDARs;$('refresh').onclick=refresh;$('new-dar').onclick=()=>openForm();$('add-activity').onclick=()=>addActivity();$('add-crew').onclick=()=>addCrew();$('add-item').onclick=()=>addItem();$('dar-form').onsubmit=event=>{event.preventDefault();saveDAR(true)};$('save-draft').onclick=()=>saveDAR(false);$('review-form').onsubmit=saveReview;$('mark-all').onclick=async()=>{await api(`/mobile/notifications/read-all?project_id=${state.project.id}`,{method:'POST',body:'{}'});await refresh()};$('management-portal').onclick=()=>location.assign('./index.html');$('logout').onclick=()=>{localStorage.removeItem('drillops_supabase_session');sessionStorage.removeItem('drillops_supabase_session');sessionStorage.removeItem('drillops_return_to');location.replace('./index.html')};document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));$('dars-panel').classList.toggle('hidden',button.dataset.tab!=='dars');$('notifications-panel').classList.toggle('hidden',button.dataset.tab!=='notifications');$('page-title').textContent=button.dataset.tab==='dars'?'Daily activity reports':'Notifications'});
  initialize();
  </script>
</body></html>
