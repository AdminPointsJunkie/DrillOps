<section class="page tracking-page" id="page-labs">
 <header class="tracking-heading"><div><div class="tracking-eyebrow">PROJECT / SAMPLES &amp; TESTING</div><h1>Labs</h1><p id="labs-context"></p></div><div><button class="btn-secondary" onclick="loadLabs()">Refresh</button><button class="btn-primary" id="labs-add" onclick="editLabSample()" disabled>Add sample</button></div></header>
 <p id="labs-message" role="status"></p><div id="labs-content" hidden><div id="labs-kpis" class="tracking-kpis"></div>
 <div class="tracking-toolbar"><label>Category<select id="labs-category"><option value="">All categories</option><option>Gas</option><option>Geotech</option><option value="CQ">Coal Quality</option><option value="FI">Frictional ignition</option><option value="Spon Comb">Spontaneous combustion</option></select></label><label>Status<select id="labs-status"><option value="">All statuses</option><option value="pending">Results pending</option><option>Collected</option><option>Dispatched</option><option>Received by lab</option><option>Testing</option><option>Results received</option><option>Reviewed</option><option>Cancelled</option></select></label><label>Search<input id="labs-search" placeholder="Sample, hole or lab"></label></div>
 <div class="tracking-table-wrap"><table class="tracking-table"><thead><tr><th>Sample / hole</th><th>Category</th><th>Lab</th><th>Taken / sent</th><th>Results due</th><th>Status</th><th>Projected cost</th><th></th></tr></thead><tbody id="labs-rows"></tbody></table></div>

 <details class="tracking-panel" id="labs-rate-section"><summary>Lab rate lists</summary><div class="tracking-toolbar"><button class="btn-primary" onclick="editLabRate()">Add lab rate</button></div><div class="tracking-table-wrap"><table class="tracking-table"><thead><tr><th>Lab</th><th>Category</th><th>Test</th><th>Unit</th><th>Rate</th><th>Active</th><th></th></tr></thead><tbody id="labs-rates"></tbody></table></div></details></div>
 <dialog id="labs-sample-dialog" class="tracking-dialog"><form id="labs-sample-form"><header><h2 id="labs-sample-title">Sample</h2><button type="button" class="btn-ghost" onclick="document.getElementById('labs-sample-dialog').close()" aria-label="Close sample">×</button></header><div class="tracking-form-grid"><label>Sample ID<input name="sample_id" required maxlength="500"></label><label>Hole<select name="hole_id"></select></label><label>Category<select name="category"><option>Gas</option><option>Geotech</option><option value="CQ">Coal Quality</option><option value="FI">Frictional ignition</option><option value="Spon Comb">Spontaneous combustion</option></select></label><label>Lab<input name="lab" list="labs-lab-names" maxlength="500"><datalist id="labs-lab-names"></datalist></label><label>Sample taken<input name="taken_on" type="date"></label><label>Dispatched<input name="sent_on" type="date"></label><label>Results due<input name="due_on" type="date"></label><label>Status<select name="status"><option>Collected</option><option>Dispatched</option><option>Received by lab</option><option>Testing</option><option>Results received</option><option>Reviewed</option><option>Cancelled</option></select></label><label>Results received<input name="results_on" type="date"></label><label>Result / report reference<input name="result_reference" maxlength="500"></label></div><h3>Tests &amp; quantities</h3><div id="labs-test-options"></div><p id="labs-test-total"></p><label>Notes<textarea name="notes" rows="3" maxlength="4000"></textarea></label><p id="labs-sample-error" class="tracking-error" role="alert"></p><footer><button class="btn-primary" type="submit">Save sample</button></footer></form></dialog>
 <dialog id="labs-rate-dialog" class="tracking-dialog"><form id="labs-rate-form"><header><h2>Lab rate</h2><button type="button" class="btn-ghost" onclick="document.getElementById('labs-rate-dialog').close()" aria-label="Close rate">×</button></header><div class="tracking-form-grid"><label>Lab<input name="lab" required maxlength="200" list="labs-lab-names"></label><label>Category<select name="category"><option>Gas</option><option>Geotech</option><option value="CQ">Coal Quality</option><option value="FI">Frictional ignition</option><option value="Spon Comb">Spontaneous combustion</option></select></label><label>Test / suite<input name="test_name" required maxlength="200"></label><label>Unit<input name="unit" value="sample" required maxlength="200"></label><label>Rate ($)<input name="unit_price" type="number" required min="0" max="1000000000" step="0.01"></label><label>Available for new samples<select name="active"><option value="true">Active</option><option value="false">Inactive</option></select></label></div><p id="labs-rate-error" class="tracking-error" role="alert"></p><footer><button class="btn-primary">Save rate</button></footer></form></dialog>
</section>
