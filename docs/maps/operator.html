</head><body><main class="operator-card"><div class="operator-brand">DrillOps <span>FieldMaps</span></div><h1>Create your operator account</h1><p class="intro">Join Argo NR automatically as a viewer/operator in the FieldMaps iPhone app. This signup does not provide desktop access.</p><form id="operator-signup"><label>Full name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone number<input name="phone" type="tel" required maxlength="50" autocomplete="tel"></label><label>Password<input name="password" type="password" required minlength="12" autocomplete="new-password" placeholder="At least 12 characters"></label><label class="check"><input name="terms" type="checkbox" required><span>I agree to the <a href="/fieldmaps-terms.html" target="_blank" rel="noopener">Terms of Service</a>.</span></label><label class="check"><input name="marketing" type="checkbox"><span id="marketing-label"></span></label><button type="submit">Create account</button></form><p id="operator-status" role="status" aria-live="polite"></p><a class="signin" href="https://apps.apple.com/au/app/id6796881116">Already have an account? Sign in in the FieldMaps app</a><p><a href="/maps/reset.html">Forgot password? Send a reset link</a></p><a class="privacy" href="/privacy.html" target="_blank" rel="noopener">Privacy policy</a></main></body></html>
