<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Converting to PDF — DrillOps FieldMaps</title>
<style>body{font:15px/1.6 system-ui,sans-serif;color:#252826;background:#f4f5f3;margin:0;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;width:min(560px,calc(100% - 32px));background:white;padding:32px;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 32px #0001}h1{font-size:24px;margin:20px 0 8px}header{font-size:17px;font-weight:650}header span{font-weight:400}p{color:#626a65}progress{width:100%;height:12px;accent-color:#147d72}#status{font-size:15px;color:#252826;overflow-wrap:anywhere}button{padding:9px 18px;border:1px solid #bbb;background:#fff;border-radius:5px;font:inherit;cursor:pointer}.note{font-size:12px}a{color:#147d72}</style></head>
