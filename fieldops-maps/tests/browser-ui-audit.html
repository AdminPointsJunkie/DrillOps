import '../src/style.css';import '../src/explore.css';import '../src/workspace.css';import '../src/workspaces.css';import '../src/workspace-settings-page.css';import '../src/invite-dialog.css';import '../src/platform-admin.css';import '../src/appearance.css';import '../src/ui-consistency.css';

else{const ui=installAccounts(db,()=>({id:'owner'}),document,{getWorkspace:()=>state.workspace,getContext:()=>({workspaces:[{...state.workspace,role:'owner'}]})});ui.openWorkspace('preview',mode);}
</script></html>
