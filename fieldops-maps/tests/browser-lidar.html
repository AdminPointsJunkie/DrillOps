<!doctype html><html><head><meta charset="utf-8"><title>LiDAR desktop drawing test</title><style>body{margin:0;font-family:system-ui}#map{height:100vh;background:#e2e9e0}#test-note{position:fixed;left:70px;top:10px;z-index:1000;background:white;padding:12px;max-width:400px}.explore-dialog form{display:block}button,input,select{padding:7px;border:1px solid #b8c8be;border-radius:5px;background:white}.dialog-heading,.dialog-actions{display:flex;align-items:center;justify-content:space-between}.error{color:#a32424}</style></head><body><div id="map"></div><div id="test-note">Synthetic DEM test · 100–164 m<br>Draw a line on the grid, then Finish line.</div><script type="module">
import L from 'leaflet';import 'leaflet/dist/leaflet.css';import '../src/lidar.css';import {writeArrayBuffer} from 'geotiff';import {openLiDAR} from '../src/lidar-ui.js';
const map=L.map('map').setView([-20.015,150.015],14),values=Float32Array.from({length:33*33},(_,i)=>100+i%33+Math.floor(i/33));const bytes=writeArrayBuffer(values,{width:33,height:33,ModelPixelScale:[.001,.001,0],ModelTiepoint:[0,0,0,150,-20,0],GeographicTypeGeoKey:4326,GTModelTypeGeoKey:2,GTRasterTypeGeoKey:1});
for(let i=0;i<=33;i++){L.polyline([[-20,150+i*.001],[-20.033,150+i*.001]],{color:'#a3b3a2',weight:1}).addTo(map);L.polyline([[-20-i*.001,150],[-20-i*.001,150.033]],{color:'#a3b3a2',weight:1}).addTo(map);}
const dialog=openLiDAR({L,map,getLayers:()=>[],canCreate:()=>true,onResult:async(fc)=>{L.geoJSON(fc).addTo(map);document.querySelector('#test-note').textContent=`Added ${fc.features.length} 3D features`;}});const data=new DataTransfer();data.items.add(new File([bytes],'synthetic-plane.tif',{type:'image/tiff'}));dialog.querySelector('[name=dem]').files=data.files;await dialog.querySelector('[data-load]').onclick();
</script></body></html>
