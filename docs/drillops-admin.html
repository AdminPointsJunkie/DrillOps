<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DrillOps · Administration</title><link rel="stylesheet" href="./brand.css"><link rel="stylesheet" href="./auth/admin.css?v=20261108-users2"><script src="./config.js?v=20261108-account1"></script><script src="./auth/unified-client.bundle.js?v=20261108-account1"></script></head><body><header><a class="do-wordmark" href="./index.html"><b>DrillOps</b></a><strong>Administration</strong><button id="signout" hidden>Sign out</button></header><main><section id="signin"><h1>DrillOps sign-in</h1><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><p id="message" role="status"></p><section id="admin" hidden><div class="heading"><div><small>ADMINISTRATION</small><h1>User access</h1></div><div class="admin-actions"><button id="refresh">Refresh</button><button id="new-user">New user</button></div></div><input id="search" type="search" placeholder="Find a person or email" aria-label="Find a user"><div class="table-wrap"><table><thead><tr><th>Person</th><th>Active</th><th>FieldMaps</th><th>EOS</th><th>Accounts</th><th>Project</th><th>Field reporting</th><th></th></tr></thead><tbody id="users"></tbody></table></div></section></main><dialog id="edit"><form id="access-form"><div class="heading"><h2 id="edit-name"></h2><button type="button" id="close">×</button></div><label class="check"><input type="checkbox" name="active">Account active</label><fieldset><legend>App access</legend><label class="check"><input type="checkbox" name="apps" value="fieldmaps">FieldMaps</label><label class="check"><input type="checkbox" name="apps" value="eos">EOS</label><label class="check"><input type="checkbox" name="apps" value="account">Accounts</label><label class="check"><input type="checkbox" name="apps" value="project">Project</label><label class="check"><input type="checkbox" name="apps" value="field">Field reporting</label></fieldset><p id="save-error" role="alert"></p><button id="save">Save access</button></form></dialog><dialog id="create"><form id="create-form"><div class="heading"><h2>New user</h2><button type="button" id="create-close" aria-label="Close">×</button></div><label>Name<input name="name" autocomplete="off" maxlength="120" required></label><label>Email<input name="email" type="email" autocomplete="off" maxlength="254" required></label><label>Starting password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><fieldset><legend>App access</legend><label class="check"><input type="checkbox" name="apps" value="fieldmaps">FieldMaps</label><label class="check"><input type="checkbox" name="apps" value="eos">EOS</label><label class="check"><input type="checkbox" name="apps" value="account">Accounts</label><label class="check"><input type="checkbox" name="apps" value="project">Project</label><label class="check"><input type="checkbox" name="apps" value="field">Field reporting</label></fieldset><p id="create-error" role="alert"></p><button id="create-save">Create user</button></form></dialog><script src="./auth/admin.js?v=20261108-users2"></script></body></html>
