<!doctype html><meta charset="utf-8"><title>FieldMaps import verification</title><h1>Browser import verification</h1><pre id="results">Running…</pre><script type="module">
import {inspect,convert} from '../src/importer.js';
import {zipSync,strToU8} from 'fflate';
const results=document.querySelector('#results');results.textContent='';let failures=0;
const assert=(v,msg)=>{if(!v)throw Error(msg)};
const fixture=async name=>new File([await (await fetch('./fixtures/'+name)).arrayBuffer()],name);
async function test(name,fn){try{await fn();results.textContent+='PASS '+name+'\n';}catch(e){failures++;results.textContent+='FAIL '+name+': '+(e.stack||e)+'\n';}}
const settings={crs:'EPSG:4326',x:'longitude',y:'latitude'};
for(const name of ['points.geojson','survey.kml','survey.kmz','survey.zip'])await test(name,async()=>{const result=await inspect([await fixture(name)]);assert(result.items.length,result.errors.join('; '));for(const item of result.items){const data=await convert(item,{...settings,crs:item.source||'EPSG:7856'});assert(data.fc.features.length,'empty output');}});
for(const name of ['points.gpkg','raster.gpkg','optimized.tif','points.gpx','points.gdb.zip','points.osm','sample.osm.pbf','grid.asc','grid.xyz','points.xlsx','points.xls','points.xlsm','points.numbers','points.tar','points.7z','points.tar.gz'])await test(name,async()=>{const original=await fixture('formats/'+name),file=new File([original],name);const result=await inspect([file]);assert(result.items.length,result.errors.join('; '));for(const item of result.items){const data=await convert(item,{...settings,crs:item.source||'EPSG:4326'});assert(data.fc?.features.length||data.blob?.size,'empty conversion');}});
await test('mixed archive with CSV and GeoJSON',async()=>{const file=new File([zipSync({'data/points.geojson':new Uint8Array(await (await fixture('points.geojson')).arrayBuffer()),'data/rows.csv':strToU8('longitude,latitude,name\n153,-27,A')})],'mixed.zip');const result=await inspect([file]);assert(result.items.length===2,result.errors.join('; '));assert(result.items.every(i=>i.files[0]===file),'original archive not retained');assert(result.items[0].importGroup.id===result.items[1].importGroup.id,'group missing');});
await test('ArcGIS LPKX archive data',async()=>{const zip={};for(const ext of ['shp','shx','dbf','prj'])zip['commondata/survey.'+ext]=new Uint8Array(await (await fixture('survey.'+ext)).arrayBuffer());const result=await inspect([new File([zipSync(zip)],'survey.lpkx')]);assert(result.items.length===1,result.errors.join('; '));});
await test('PNG annotation rendering and rotation',async()=>{const canvas=document.createElement('canvas');canvas.width=80;canvas.height=40;const ctx=canvas.getContext('2d');ctx.fillStyle='red';ctx.fillRect(0,0,80,40);const png=await new Promise(r=>canvas.toBlob(r));const result=await inspect([new File([png],'photo.png')]);assert(result.items.length===1,result.errors.join('; '));assert(result.items[0].image,'not an annotation');const data=await convert(result.items[0],{...settings,image:{lng:153,lat:-27,width:100,rotation:30}});assert(data.blob.size>0&&data.bounds[0]<153,'invalid placement');});
await test('VRT referencing an included raster',async()=>{const vrt=new File(['<VRTDataset rasterXSize="2" rasterYSize="2"><SRS>EPSG:4326</SRS><GeoTransform>153,0.001,0,-27,0,-0.001</GeoTransform><VRTRasterBand dataType="Byte" band="1"><SimpleSource><SourceFilename relativeToVRT="1">raster.tif</SourceFilename><SourceBand>1</SourceBand><SrcRect xOff="0" yOff="0" xSize="2" ySize="2"/><DstRect xOff="0" yOff="0" xSize="2" ySize="2"/></SimpleSource></VRTRasterBand></VRTDataset>'],'mosaic.vrt');const result=await inspect([vrt,await fixture('raster.tif')]);assert(result.items.some(i=>i.name==='mosaic'),result.errors.join('; '));const data=await convert(result.items.find(i=>i.name==='mosaic'),settings);assert(data.blob.size>0,'VRT did not render');});
await test('PNG with world file remains a georeferenced raster',async()=>{const files=await Promise.all(['georeferenced.png','georeferenced.wld'].map(async name=>new File([await fixture('formats/'+name)],name)));const result=await inspect(files);assert(result.items.length===1,result.errors.join('; '));assert(!result.items[0].image&&result.items[0].hasTransform,'image was not georeferenced');const data=await convert(result.items[0],settings);assert(data.blob.size>0,'raster missing');});
await test('PDF annotation',async()=>{const pdf='%PDF-1.1\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 100]/Resources<<>>/Contents 4 0 R>>endobj\n4 0 obj<</Length 24>>stream\n1 0 0 rg 0 0 50 50 re f\nendstream\nendobj\ntrailer<</Root 1 0 R>>\n%%EOF';const result=await inspect([new File([pdf],'plan.pdf')]);assert(result.items[0]?.image,result.errors.join('; '));});
results.textContent+='DONE: '+failures+' failures';document.title=failures?'FAILED import verification':'PASSED import verification';
</script>
